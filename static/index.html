<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171614">
  <title>KINETIQ</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">K</span>
      <h1>KINETIQ</h1>
    </div>
    <div class="topbar-actions">
      <div class="conversation-controls">
        <label for="conversationSelect" class="sr-only">Conversation</label>
        <select id="conversationSelect" aria-label="Conversation"></select>
        <button id="newConversationButton" type="button">New conversation</button>
      </div>
      <div class="connection">
        <span id="statusText">Microphone off</span>
        <span class="status-indicator" id="statusIndicator" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="conversation" id="conversation" aria-live="polite">
      <div class="empty-state" id="emptyState">
        <p>Type a message or say <strong>“Hey Jarvis.”</strong></p>
        <p>Your speech is transcribed on this machine. Only text is sent to OpenRouter.</p>
      </div>
    </section>
    <aside class="pi-activity" aria-labelledby="piActivityTitle">
      <div class="pi-activity-header">
        <h2 id="piActivityTitle">Pi activity</h2>
        <span id="piJobCount">0 jobs</span>
      </div>
      <div id="piJobs" class="pi-jobs">
        <p class="pi-empty">No background work.</p>
      </div>
    </aside>
  </main>

  <footer class="controls">
    <div class="listening-status">
      <canvas id="meter" width="112" height="32" aria-hidden="true"></canvas>
      <div>
        <strong id="modeLabel">Not listening</strong>
        <span id="modeHint">Type below or turn on the microphone.</span>
      </div>
    </div>
    <form id="messageForm" class="message-form">
      <label for="messageInput" class="sr-only">Message KINETIQ</label>
      <input id="messageInput" name="message" type="text" autocomplete="off" placeholder="Message KINETIQ" required>
      <button id="sendButton" type="submit">Send</button>
    </form>
    <div class="voice-controls">
      <label class="speech-toggle" for="speechToggle">
        <span>Speak replies</span>
        <input id="speechToggle" type="checkbox" role="switch" checked>
      </label>
      <button id="listenButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11v1a7 7 0 0 1-14 0v-1M12 19v3M8 22h8"/></svg>
        <span>Start listening</span>
      </button>
    </div>
  </footer>

  <script src="/static/app.js" defer></script>
</body>
</html>
